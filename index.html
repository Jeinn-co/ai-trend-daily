<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Trend Daily · AI 趨勢日報</title>
    <meta name="description" content="AI news most people care about — tools, new models, jobs, rules and scams, chips, everyday life — collected every 12 hours with links to every original source." />
    <meta name="theme-color" content="#f4f5f7" />
    <script>
      // set the theme before first paint so dark mode doesn't flash light; storage can throw in private windows
      try { var t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f4f5f7;
        --sheet: #ffffff;
        --ink: #14161c;
        --muted: #5d6472;
        --line: #e2e5eb;
        --accent: #3d3bf3;
        color-scheme: light;
        --display: "Schibsted Grotesk", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
        color: var(--ink);
        background: var(--paper);
        font-synthesis: none;
      }
      :root[data-theme="dark"] {
        --paper: #0f1115;
        --sheet: #171a21;
        --ink: #eceef3;
        --muted: #9aa2b1;
        --line: #272b35;
        --accent: #8f8dff;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); }
      button, input, select, a { font: inherit; color: inherit; touch-action: manipulation; }
      a { text-decoration: none; }
      a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
      [hidden] { display: none !important; }
      .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

      .sheet { max-width: 1040px; margin: 0 auto; padding: 32px 20px 56px; }

      /* masthead */
      .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; }
      h1 { margin: 0; font-family: var(--display); font-size: 44px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
      h1 small { display: block; margin-top: 8px; font-size: 17px; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); }
      .meta { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
      .tools { display: flex; gap: 8px; flex: 1 1 280px; max-width: 380px; }
      .search { flex: 1; min-width: 0; padding: 9px 14px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); }
      .btn { padding: 9px 14px; font-size: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet); cursor: pointer; }
      .btn:hover { border-color: var(--muted); }

      /* signature: the topic pulse. Each segment's width is that topic's share of today's stories */
      .pulse-wrap { margin: 28px 0 8px; }
      .pulse-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
      .pulse { display: flex; flex-wrap: wrap; gap: 4px; }
      .seg { flex: var(--n) 1 132px; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 9px;
        border: 0; border-radius: 10px; background: color-mix(in srgb, var(--c) 13%, var(--sheet)); text-align: left; cursor: pointer;
        box-shadow: inset 0 -4px 0 var(--c); transition: background 0.15s; }
      .seg:hover { background: color-mix(in srgb, var(--c) 22%, var(--sheet)); }
      .seg[aria-selected="true"] { background: var(--c); color: #fff; box-shadow: none; }
      .seg b { font-family: var(--display); font-size: 15px; font-weight: 700; line-height: 1.2; }
      .seg span { font-size: 13px; opacity: 0.85; }
      .seg .n { font-family: var(--mono); font-size: 20px; font-weight: 500; line-height: 1; opacity: 1; }
      .seg.home { flex: 0 1 132px; }
      .seg.home[aria-selected="true"] { color: var(--paper); }

      /* story list */
      .panel { margin-top: 28px; }
      .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
      .panel-head h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .panel-head h2 span + span { margin-left: 8px; font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; }
      .stories { margin: 0; padding: 0; list-style: none; background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; }
      .story { display: grid; grid-template-columns: 52px 1fr; gap: 0 14px; padding: 16px 20px 16px 12px; border-top: 1px solid var(--line); }
      .story:first-child { border-top: 0; }
      .rank { padding-top: 2px; font-family: var(--mono); font-size: 18px; color: var(--muted); text-align: right; }
      .story h3 { margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; text-wrap: pretty; }
      .summary { display: -webkit-box; margin: 6px 0 0; overflow: hidden; color: var(--muted); font-size: 15px; line-height: 1.65;
        -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; font-size: 13px; color: var(--muted); }
      .topic { display: inline-flex; align-items: center; gap: 6px; color: color-mix(in srgb, var(--c) 70%, var(--ink)); font-weight: 600; }
      .topic::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
      /* the lead story: the one thing to know today */
      .story.lead { padding-top: 22px; padding-bottom: 22px; }
      .story.lead .rank { font-size: 30px; color: var(--accent); }
      .story.lead h3 { font-size: 27px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.3; }
      .story.lead .summary { -webkit-line-clamp: 4; font-size: 16px; }
      .story:nth-child(-n+3):not(.lead) .rank { color: var(--ink); }

      details.src summary { cursor: pointer; list-style: none; }
      details.src summary::-webkit-details-marker { display: none; }
      details.src summary::after { content: " ▾"; }
      details.src[open] summary::after { content: " ▴"; }
      details.src ul { margin: 6px 0 0; padding-left: 18px; }
      details.src li { margin: 2px 0; word-break: break-all; }

      .more { display: block; margin: 20px auto 0; }
      .empty { padding: 32px; text-align: center; color: var(--muted); }

      footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; line-height: 1.7; }
      footer h4 { margin: 18px 0 6px; color: var(--ink); font-family: var(--display); font-size: 15px; font-weight: 700; }
      footer select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); color: var(--ink); }
      footer a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
      .srclist { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; }

      @media (prefers-reduced-motion: reduce) { .seg { transition: none; } }
      @media (max-width: 640px) {
        .sheet { padding: 22px 16px 40px; }
        h1 { font-size: 34px; }
        .tools { max-width: none; }
        .seg { flex-basis: calc(50% - 2px); }
        .seg.home { flex-basis: 100%; }
        .story { grid-template-columns: 34px 1fr; gap: 0 10px; padding: 14px 14px 14px 8px; }
        .rank { font-size: 15px; }
        .story.lead .rank { font-size: 22px; }
        .story h3 { font-size: 17px; }
        .story.lead h3 { font-size: 22px; }
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <header class="head">
        <div>
          <h1>AI Trend Daily<small>AI 趨勢日報</small></h1>
          <p class="meta">Updated 更新於 <b id="updated" class="mono" translate="no">—</b>（台北時間）· 每 12 小時更新</p>
        </div>
        <div class="tools">
          <input id="q" name="q" class="search" type="search" placeholder="Search 搜尋標題…" autocomplete="off" aria-label="Search titles and descriptions" />
          <button id="theme" class="btn" type="button" aria-label="Dark mode" aria-pressed="false"><span aria-hidden="true">◐</span></button>
        </div>
      </header>

      <nav class="pulse-wrap" aria-label="Topics">
        <div class="pulse-label"><span>Today by topic · 今日主題</span><span id="total" class="mono" translate="no"></span></div>
        <div id="pulse" class="pulse" role="tablist"></div>
      </nav>
      <main id="view"></main>

      <footer>
        <h4>Archive · 過去版本</h4>
        <select id="archive" translate="no" aria-label="Open an earlier snapshot"><option value="">Latest 最新</option></select>
        <h4>Sources · 來源</h4>
        <ul id="srclist" class="srclist"></ul>
        <h4>About · 關於</h4>
        <p>
          每 12 小時自動收集一次，只收一般人最關心的六類 AI 新聞。標題與簡介取自各來源公開的 RSS 或頁面資訊，維持原文不翻譯；分類與排名由規則產生。
          所有文章屬於原出版者，本站只顯示標題、簡短描述與連結，每則都標出來源，點標題會開啟原文。
        </p>
        <!-- version comes from package.json, which the workflow deploys next to this page -->
        <p class="mono">Version <span id="version" translate="no">–</span></p>
      </footer>
    </div>

    <script>
      const HOME = "Headlines";
      const TOPICS = ["Tools & Apps", "New Models", "Work & Jobs", "Rules & Safety", "Chips & Industry", "Everyday AI"];
      const ZH = { Headlines: "今日頭條", "Tools & Apps": "AI 工具", "New Models": "新模型", "Work & Jobs": "工作",
        "Rules & Safety": "法規與詐騙", "Chips & Industry": "晶片與產業", "Everyday AI": "生活應用", Other: "其他" };
      const COLOR = { // mid-saturation hues that read on both the light and the dark sheet
        "Tools & Apps": "#2f6df6", "New Models": "#9b4dea", "Work & Jobs": "#e0731b",
        "Rules & Safety": "#d43c4f", "Chips & Industry": "#0f9b8e", "Everyday AI": "#3f9d3a", Other: "#7a8291" };
      const color = (k) => COLOR[k] || COLOR.Other;
      const $ = (id) => document.getElementById(id);
      const ALL = "__all"; // the "all stories by score" panel
      const fromHash = decodeURIComponent(location.hash.slice(1));
      const state = { data: null, tab: [HOME, ...TOPICS].includes(fromHash) ? fromHash : HOME, expanded: false, q: "" };
      const listFor = (tab) => (tab === HOME ? state.data.highlights?.Headlines : state.data.categories?.[tab]) || [];

      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? esc(u) : "#");
      const link = (url, text) => `<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>`;
      const taipei = (iso) =>
        new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(iso));
      const rtf = new Intl.RelativeTimeFormat("zh-TW", { numeric: "auto" });
      const ago = (iso) => {
        const min = Math.round((Date.parse(iso) - Date.now()) / 60000);
        return min > -60 ? rtf.format(min, "minute") : rtf.format(Math.round(min / 60), "hour");
      };

      function sources(it) {
        const first = it.sources[0]?.name ?? "";
        const label = it.sources.length > 1 ? `${esc(first)} +${it.sources.length - 1}` : esc(first);
        const items = it.sources.map((s) => `<li translate="no">${esc(s.name)}：${link(s.url, s.url)}</li>`).join("");
        return `<details class="src"><summary translate="no">${label}</summary><ul>${items}</ul></details>`;
      }

      function story(it, rank, lead) {
        return `<li class="story${lead ? " lead" : ""}" data-hay="${esc(`${it.title} ${it.summary}`.toLowerCase())}">
          <span class="rank" translate="no">${rank}</span>
          <div>
            <h3>${link(it.primary_url, it.title)}</h3>
            ${it.summary ? `<p class="summary">${esc(it.summary)}</p>` : ""}
            <div class="info"><span class="topic" style="--c:${color(it.category)}">${esc(ZH[it.category] || it.category)}</span>
              ${sources(it)}<span class="mono">${esc(ago(it.published_at))}</span></div>
          </div>
        </li>`;
      }

      // Everything is rendered once per data load; tabs, "all stories" and search only toggle `hidden`.
      // Rebuilding the DOM on every click threw away the browser's translation (Chrome Translate etc.).
      function renderPulse() {
        const seg = (id, n, extra = "") => `<button class="seg${extra}" role="tab" style="--c:${id === HOME ? "var(--ink)" : color(id)};--n:${Math.max(n, 1)}"
          data-tab="${esc(id)}" aria-selected="false"><span class="n" translate="no">${n}</span><b translate="no">${esc(id)}</b><span>${esc(ZH[id])}</span></button>`;
        $("pulse").innerHTML = seg(HOME, listFor(HOME).length, " home") + TOPICS.map((t) => seg(t, listFor(t).length)).join("");
        $("total").textContent = `${state.data.all.length} stories`;
      }

      function panel(id, title, list, extra = "") {
        return `<section class="panel" data-panel="${esc(id)}" hidden>
          <div class="panel-head"><h2>${title}</h2></div>
          <p class="empty" data-empty${list.length ? " hidden" : ""}>${list.length ? "No matches · 沒有符合的新聞" : "No stories in this topic right now · 這個主題目前沒有新聞"}</p>
          <ol class="stories">${list.map((it, i) => story(it, i + 1, id === HOME && i === 0)).join("")}</ol>${extra}</section>`;
      }

      function renderPanels() {
        const d = state.data;
        const title = (id) => `<span translate="no">${esc(id)}</span><span>${esc(ZH[id])}</span>`;
        $("view").innerHTML =
          [HOME, ...TOPICS].map((t) => panel(t, title(t), listFor(t),
            t === HOME ? `<button class="btn more" type="button" data-action="expand">All ${d.all.length} stories by score · 看全部</button>` : "")).join("") +
          panel(ALL, `<span translate="no">All stories</span><span>全部新聞</span>`, d.all,
            `<button class="btn more" type="button" data-action="collapse">Back to headlines · 回到頭條</button>`);
      }

      function show() {
        const id = state.tab === HOME && state.expanded ? ALL : state.tab;
        $("pulse").querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === state.tab));
        $("view").querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== id));
        filter();
      }

      function filter() {
        const p = $("view").querySelector("[data-panel]:not([hidden])");
        if (!p) return;
        let shown = 0;
        p.querySelectorAll(".story").forEach((s) => {
          s.hidden = state.q && !s.dataset.hay.includes(state.q);
          if (!s.hidden) shown++;
        });
        p.querySelector("[data-empty]").hidden = shown > 0;
      }

      function renderMeta() {
        const d = state.data;
        $("updated").textContent = taipei(d.updated_at);
        $("srclist").innerHTML = (d.source_list || []).map((s) => `<li>${link(new URL(s.url).origin, s.name)}</li>`).join("");
      }

      async function load(path) {
        const res = await fetch(`${path}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`${path}: ${res.status}`);
        state.data = await res.json();
        state.expanded = false;
        renderMeta();
        renderPulse();
        renderPanels();
        show();
      }

      async function loadVersion() {
        const res = await fetch(`package.json?t=${Date.now()}`).catch(() => null);
        if (res?.ok) $("version").textContent = (await res.json()).version;
      }

      async function loadArchive() {
        const res = await fetch(`data/archive/index.json?t=${Date.now()}`);
        if (!res.ok) return;
        const names = await res.json();
        $("archive").insertAdjacentHTML("beforeend", names.map((n) => `<option value="${esc(n)}">${esc(n.replace(/^(\d{4}-\d{2}-\d{2})-(\d{2})$/, "$1 $2:00 UTC"))}</option>`).join(""));
      }

      $("pulse").addEventListener("click", (e) => {
        const b = e.target.closest("[data-tab]");
        if (!b) return;
        state.tab = b.dataset.tab;
        state.expanded = false;
        history.replaceState(null, "", state.tab === HOME ? location.pathname : `#${encodeURIComponent(state.tab)}`);
        show();
      });
      $("view").addEventListener("click", (e) => {
        const b = e.target.closest("[data-action]");
        if (!b) return;
        state.expanded = b.dataset.action === "expand";
        show();
      });
      $("q").addEventListener("input", (e) => {
        state.q = e.target.value.trim().toLowerCase();
        filter();
      });
      $("archive").addEventListener("change", (e) => {
        load(e.target.value ? `data/archive/${e.target.value}.json` : "data/latest.json").catch(showError);
      });

      const root = document.documentElement;
      const syncTheme = () => {
        const dark = root.dataset.theme === "dark";
        $("theme").setAttribute("aria-pressed", dark);
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0f1115" : "#f4f5f7";
      };
      syncTheme();
      $("theme").addEventListener("click", () => {
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
        syncTheme();
      });

      const showError = (err) => {
        $("view").innerHTML = `<p class="empty">Could not load the data — reload in a minute. 資料載入失敗，請稍後重新整理。(${esc(err.message)})</p>`;
      };
      load("data/latest.json").catch(showError);
      loadArchive();
      loadVersion();
    </script>
  </body>
</html>
