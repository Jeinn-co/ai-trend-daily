# 原有來源於 2026-11-05 實測可抓，測試結果見 sources_report.md；Techmeme、Readhub、The Decoder、
# Hugging Face Papers、量子位、IT之家於 2026-11-14 以 curl 確認可連線，尚未用 check_sources.py 重測。
# type: rss | sitemap | hn | github_trending | hf_models | hf_papers | readhub
# weight: 1-5，評分的「來源權重」
# group: 同一 group 視為同一來源，計算跨來源報導數時不重複計（預設為 name）
# ai_filter: true 表示來源不是 AI 專屬分類，只留標題或摘要含 AI 關鍵字的項目
# limit: 每次最多取幾則（依發布時間由新到舊）
# 選來源的原則：優先用帶熱度訊號的來源（HN 分數、Techmeme／Readhub 的報導家數、投票、星數）；
# 官方部落格與媒體 RSS 只照時間排，權重較低，主要用來增加跨來源報導數。

sources:
  # 熱度來源：編輯精選或有分數
  - {name: Techmeme, url: "https://www.techmeme.com/feed.xml", type: rss, weight: 5, ai_filter: true}
  - {name: Hacker News, url: "https://hn.algolia.com/api/v1/search_by_date", type: hn, weight: 4, min_points: 100}
  - {name: Readhub, url: "https://api.readhub.cn/topic/list", type: readhub, weight: 4, ai_filter: true}
  - {name: r/MachineLearning, url: "https://www.reddit.com/r/MachineLearning/top/.rss?t=day", type: rss, weight: 2, group: Reddit}
  - {name: r/LocalLLaMA, url: "https://www.reddit.com/r/LocalLLaMA/top/.rss?t=day", type: rss, weight: 2, group: Reddit}

  # 官方部落格（佐證來源）
  - {name: OpenAI, url: "https://openai.com/news/rss.xml", type: rss, weight: 4}
  # shortcut: Anthropic 沒有 RSS，sitemap 的 lastmod 會在網站重新部署時全部刷新，舊文章會被當成新的；
  # 停用到改成「只收上一份 archive 沒出現過的網址」為止
  # - {name: Anthropic, url: "https://www.anthropic.com/sitemap.xml", type: sitemap, prefix: "https://www.anthropic.com/news/", weight: 4}
  - {name: Google DeepMind, url: "https://deepmind.google/blog/rss.xml", type: rss, weight: 4}
  - {name: Hugging Face Blog, url: "https://huggingface.co/blog/feed.xml", type: rss, weight: 3}
  - {name: Mistral AI, url: "https://mistral.ai/rss.xml", type: rss, weight: 3}
  - {name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", type: rss, weight: 3}

  # 科技媒體 AI 分類
  - {name: TechCrunch, url: "https://techcrunch.com/category/artificial-intelligence/feed/", type: rss, weight: 3}
  - {name: The Verge, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", type: rss, weight: 3}
  - {name: MIT Technology Review, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed", type: rss, weight: 3}
  - {name: Ars Technica, url: "https://arstechnica.com/ai/feed/", type: rss, weight: 3}
  - {name: The Decoder, url: "https://the-decoder.com/feed/", type: rss, weight: 3}

  # 論文：只取 Hugging Face Daily Papers 前一天的榜單，依 upvotes
  - {name: Hugging Face Papers, url: "https://huggingface.co/api/daily_papers", type: hf_papers, weight: 2, limit: 10}

  # 開源
  - {name: GitHub Trending, url: "https://github.com/trending?since=daily", type: github_trending, weight: 3, min_stars: 100}
  - {name: Hugging Face Trending, url: "https://huggingface.co/api/models?sort=trendingScore&limit=20", type: hf_models, weight: 3}

  # 中文（簡體）
  - {name: 量子位, url: "https://www.qbitai.com/feed", type: rss, weight: 3}
  - {name: IT之家, url: "https://www.ithome.com/rss/", type: rss, weight: 2, ai_filter: true, limit: 20}

  # 中文（繁體；這兩個來源沒有 AI 分類 feed，用關鍵字過濾）
  - {name: iThome, url: "https://www.ithome.com.tw/rss.xml", type: rss, weight: 3, ai_filter: true}
  - {name: INSIDE, url: "https://www.inside.com.tw/feed/rss", type: rss, weight: 3, ai_filter: true}
