name: Update AI trend data

on:
  schedule:
    - cron: "0 */6 * * *" # UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, package.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # a failed run exits non-zero before writing anything, so the last published data stays live
      - name: Fetch and rank
        if: github.event_name != 'push'
        run: python scripts/run_local.py

      - name: Commit the new snapshot
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html package.json _site/
          if [ -d data ]; then cp -r data _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
